# Local development stack: Postgres + Redis + API + worker.
# Copy .env.example → .env first. The DATABASE_URL / REDIS_URL below override
# whatever is in .env so the app talks to these containers, not Neon/Upstash.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blogdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blogdb']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://blog:blog@postgres:5432/blogdb?schema=public
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ['node', 'dist/queues/worker.js']
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blog:blog@postgres:5432/blogdb?schema=public
      REDIS_URL: redis://redis:6379
      # API service owns migrations — don't race it.
      RUN_MIGRATIONS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
